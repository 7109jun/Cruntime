name: build-windows

# Builds LLVM/Clang 18 (only what CRuntime needs, cached) and CRuntime.exe, then uploads the result.
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore LLVM install
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\llvm18
          key: llvm-18.1.8-dist-x64-md-v2

      # ccache keeps compiled objects across runs, so an interrupted LLVM build resumes instead of restarting.
      - name: ccache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llvm-18.1.8-v2
          max-size: 5G

      - name: Fetch LLVM 18.1.8 sources
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-18.1.8
          path: llvm-src
          fetch-depth: 1
          sparse-checkout: |
            llvm
            clang
            cmake
            third-party

      - name: Configure LLVM/Clang
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        shell: cmd
        run: |
          cmake -S llvm-src\llvm -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
            -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_RTTI=OFF -DLLVM_OPTIMIZED_TABLEGEN=ON ^
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_DOCS=OFF ^
            -DCLANG_ENABLE_ARCMT=OFF -DCLANG_ENABLE_STATIC_ANALYZER=OFF -DCLANG_ENABLE_OBJC_REWRITER=OFF ^
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_INSTALL_PREFIX=C:\llvm18 ^
            "-DLLVM_DISTRIBUTION_COMPONENTS=llvm-libraries;llvm-headers;cmake-exports;clang-libraries;clang-headers;clang-cmake-exports;clang-resource-headers"

      - name: Build LLVM/Clang
        id: build-llvm
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        shell: cmd
        run: cmake --build llvm-build --target install-distribution

      - name: Save LLVM install
        if: steps.build-llvm.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\llvm18
          key: llvm-18.1.8-dist-x64-md-v2

      - name: Build CRuntime
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Zi" "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /INCREMENTAL:NO /OPT:REF /OPT:ICF" ^
            -DLLVM_DIR=C:\llvm18\lib\cmake\llvm -DClang_DIR=C:\llvm18\lib\cmake\clang
          cmake --build build -- -k 0

      - name: Debugger stack of the crash
        shell: pwsh
        timeout-minutes: 10
        continue-on-error: true
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { "cdb.exe not found"; Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -ErrorAction SilentlyContinue; exit 0 }
          $p = Start-Process -FilePath $cdb.FullName -PassThru -NoNewWindow `
               -ArgumentList @('-y','build','-c','"sxd av;sxd ibp;g;.lastevent;k 40;q"','build\CRuntime.exe','--help') `
               -RedirectStandardOutput cdb.out.txt -RedirectStandardError cdb.err.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); "cdb TIMEOUT" }
          Get-Content cdb.out.txt | Select-Object -Last 90
          Get-Content cdb.err.txt -ErrorAction SilentlyContinue

      - name: Diagnostics
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          function Probe([string]$name, [string[]]$argv) {
            $p = Start-Process -FilePath build\CRuntime.exe -ArgumentList $argv -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$name.out.txt" -RedirectStandardError "$name.err.txt"
            if (-not $p.WaitForExit(60000)) { $p.Kill(); "===== $name : $($argv -join ' ')  TIMEOUT (killed after 60s)" }
            else { "===== $name : $($argv -join ' ')  exit=0x{0:X8}" -f $p.ExitCode }
            "--- stdout"; Get-Content "$name.out.txt" -ErrorAction SilentlyContinue
            "--- stderr"; Get-Content "$name.err.txt" -ErrorAction SilentlyContinue
          }
          Probe 'probe_help'  @('--help')
          Probe 'probe_noarg' @('run')
          Probe 'probe_hello' @('run','examples\hello.cpp','-v')
          "===== crash events"
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 3 -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Message }
          "===== dependents"
          dumpbin /dependents build\CRuntime.exe

      - name: Smoke tests
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          # CRuntime.exe is a GUI-subsystem exe: Start-Process -Wait is required to wait for it.
          $i = 0
          foreach ($t in @(@('examples\hello.cpp','-v'), @('examples\cproj'), @('examples\exceptions.cpp'))) {
            $i++
            $a = @('run') + $t
            $p = Start-Process -FilePath build\CRuntime.exe -ArgumentList $a -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput "smoke$i.out.txt" -RedirectStandardError "smoke$i.err.txt"
            "===== smoke$i : $($t -join ' ')  exit=$($p.ExitCode)"
            "--- stdout"; Get-Content "smoke$i.out.txt" -ErrorAction SilentlyContinue
            "--- stderr"; Get-Content "smoke$i.err.txt" -ErrorAction SilentlyContinue
          }

      - name: Package
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if (Test-Path build\CRuntime.exe) { Copy-Item build\CRuntime.exe dist\ }
          if (Test-Path build\clang_resource) { Copy-Item build\clang_resource dist\clang_resource -Recurse }
          Copy-Item examples dist\examples -Recurse
          Copy-Item smoke*.txt dist\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath CRuntime-win64.zip -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRuntime-win64
          path: dist

      - name: Publish rolling release "latest"
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest CRuntime-win64.zip --title "CRuntime (latest build)" --notes "Automated build of ${{ github.sha }}. Needs VS Build Tools (C++) + Windows SDK on the machine that runs it."
