name: build-windows

# Builds LLVM/Clang 18 (cached) and CRuntime.exe on a Windows runner and uploads the result.
# Usage: push this folder to a GitHub repo -> Actions -> build-windows -> Run workflow -> download artifact.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache LLVM/Clang
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm18
          key: llvm-18.1.8-clang-x64-md-v1

      - name: Build LLVM/Clang 18.1.8 (first run only, ~1-2h)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz
          tar -xf llvm.tar.xz
          cmake -S llvm-project-18.1.8.src\llvm -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_ENABLE_ASSERTIONS=OFF -DLLVM_ENABLE_RTTI=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_INSTALL_PREFIX=C:\llvm18
          cmake --build llvm-build --target install

      - name: Build CRuntime
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_DIR=C:\llvm18\lib\cmake\llvm -DClang_DIR=C:\llvm18\lib\cmake\clang
          cmake --build build

      - name: Smoke tests
        shell: cmd
        continue-on-error: true
        run: |
          build\CRuntime.exe run examples\hello.cpp -v > smoke1.txt 2>&1
          type smoke1.txt
          build\CRuntime.exe run examples\cproj > smoke2.txt 2>&1
          type smoke2.txt
          build\CRuntime.exe run examples\exceptions.cpp > smoke3.txt 2>&1
          type smoke3.txt

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\CRuntime.exe dist\
          Copy-Item build\clang_resource dist\clang_resource -Recurse
          Copy-Item examples dist\examples -Recurse
          Copy-Item smoke*.txt dist\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: CRuntime-win64
          path: dist
